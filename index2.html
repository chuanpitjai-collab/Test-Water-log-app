<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกคุณภาพน้ำและข้อมูลการผลิต</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f2f5;
      padding: 16px;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 450px;
      margin: auto;
    }
    h2, h3 {
      color: #0284c7;
      text-align: center;
    }
    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f8fafc;
    }
    legend {
      font-weight: bold;
      color: #0369a1;
      padding: 0 5px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:active {
      background-color: #0369a1;
    }
    .btn-gen {
      background-color: #16a34a;
    }
    .btn-gen:active {
      background-color: #15803d;
    }
    textarea {
      height: 100px;
      background: #f1f5f9;
      font-family: monospace;
      font-size: 12px;
    }
    ul {
      padding-left: 20px;
      color: #555;
      max-height: 200px;
      overflow-y: auto;
    }
    li {
      margin-bottom: 10px;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>ระบบบันทึกข้อมูล (Index2)</h2>
  
  <fieldset>
    <legend>💧 บันทึกคุณภาพน้ำ</legend>
    <div class="form-group">
      <label>วันที่และเวลาบันทึก:</label>
      <input type="datetime-local" id="recordDate">
    </div>
    <div class="form-group">
      <label>รหัสจุดตรวจวัด (Station ID):</label>
      <input type="text" id="station" placeholder="เช่น A2">
    </div>
    <div class="form-group">
      <label>ค่าความเป็นกรด-ด่าง (pH):</label>
      <input type="number" step="0.1" id="ph" placeholder="เช่น 8.5">
    </div>
    <div class="form-group">
      <label>อุณหภูมิ (°C):</label>
      <input type="number" step="0.1" id="temp" placeholder="เช่น 27.5">
    </div>
    <div class="form-group">
      <label>ออกซิเจนละลายน้ำ (DO mg/L):</label>
      <input type="number" step="0.1" id="doValue" placeholder="เช่น 6.5">
    </div>
    <div class="form-group">
      <label>แอมโมเนีย (Ammonia mg/L):</label>
      <input type="number" step="0.01" id="ammonia" placeholder="เช่น 0">
    </div>
    <div class="form-group">
      <label>ไนไตรท์ (Nitrite mg/L):</label>
      <input type="number" step="0.01" id="nitrite" placeholder="เช่น 0">
    </div>
  </fieldset>

  <fieldset>
    <legend>🐟 ข้อมูลการผลิต</legend>
    <div class="form-group">
      <label>1. วันที่เก็บไข่:</label>
      <input type="date" id="eggDate">
    </div>
    <div class="form-group">
      <label>2. แผงไข่เข้าฟัก:</label>
      <input type="text" id="eggIncubate" placeholder="เช่น 10 แผง">
    </div>
    <div class="form-group">
      <label>3. ลูกปลาแรกฟัก (ตัว):</label>
      <input type="number" id="fishHatch" placeholder="เช่น 5000">
    </div>
    <div class="form-group">
      <label>4. ลูกปลาอนุบาล (ตัว):</label>
      <input type="number" id="fishNursery" placeholder="เช่น 4500">
    </div>
    <div class="form-group">
      <label>5. ลูกปลาพร้อมจำหน่าย (ตัว):</label>
      <input type="number" id="fishReady" placeholder="เช่น 4000">
    </div>
  </fieldset>

  <button onclick="saveData()">บันทึกข้อมูลทั้งหมด</button>
  <button class="btn-gen" onclick="generateExcelText()">📋 แสดงข้อมูลสำหรับก๊อปปี้ไป Excel</button>

  <div class="form-group">
    <label>ก๊อปปี้ข้อความด้านล่างนี้ไปวางใน Excel:</label>
    <textarea id="outputBox" placeholder="กดปุ่มเขียวด้านบนเพื่อสร้างข้อความตาราง..."></textarea>
  </div>

  <h3>ประวัติการบันทึก</h3>
  <ul id="logList"></ul>
</div>

<script>
  window.onload = function() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    const dateInput = document.getElementById('recordDate');
    if (dateInput) {
      dateInput.value = now.toISOString().slice(0, 16);
    }
    loadLogs();
  };

  function saveData() {
    const recordDate = document.getElementById('recordDate').value;
    const station = document.getElementById('station').value;
    const ph = document.getElementById('ph').value;
    const temp = document.getElementById('temp').value;
    const doValue = document.getElementById('doValue').value;
    const ammonia = document.getElementById('ammonia').value;
    const nitrite = document.getElementById('nitrite').value;

    const eggDate = document.getElementById('eggDate').value;
    const eggIncubate = document.getElementById('eggIncubate').value;
    const fishHatch = document.getElementById('fishHatch').value;
    const fishNursery = document.getElementById('fishNursery').value;
    const fishReady = document.getElementById('fishReady').value;

    const finalDate = recordDate ? new Date(recordDate).toLocaleString('th-TH') : new Date().toLocaleString('th-TH');

    const rawData = {
      timestamp: finalDate,
      station: station || '-',
      ph: ph || '-',
      temp: temp || '-',
      doValue: doValue || '-',
      ammonia: ammonia || '-',
      nitrite: nitrite || '-',
      eggDate: eggDate || '-',
      eggIncubate: eggIncubate || '-',
      fishHatch: fishHatch || '-',
      fishNursery: fishNursery || '-',
      fishReady: fishReady || '-'
    };

    let rawLogs = JSON.parse(localStorage.getItem('waterRawLogs2') || '[]');
    rawLogs.unshift(rawData);
    localStorage.setItem('waterRawLogs2', JSON.stringify(rawLogs));

    let logText = `📅 <b>${finalDate}</b><br>`;
    if(station) logText += `📍 จุด: ${station} | pH: ${ph || '-'} | 🌡️ ${temp || '-'}°C | DO: ${doValue || '-'}<br>`;
    if(eggIncubate || fishReady || eggDate) {
      logText += `🐟 ผลิต: ไข่[${eggDate || '-'}] | เข้าฟัก: ${eggIncubate || '-'} | แรกฟัก: ${fishHatch || '-'}`;
    }

    let logs = JSON.parse(localStorage.getItem('waterLogs2') || '[]');
    logs.unshift(logText);
    localStorage.setItem('waterLogs2', JSON.stringify(logs));

    document.getElementById('station').value = '';
    document.getElementById('ph').value = '';
    document.getElementById('temp').value = '';
    document.getElementById('doValue').value = '';
    document.getElementById('ammonia').value = '';
    document.getElementById('nitrite').value = '';
    document.getElementById('eggDate').value = '';
    document.getElementById('eggIncubate').value = '';
    document.getElementById('fishHatch').value = '';
    document.getElementById('fishNursery').value = '';
    document.getElementById('fishReady').value = '';

    loadLogs();
    alert("บันทึกข้อมูลสำเร็จ!");
  }

  function loadLogs() {
    const ul = document.getElementById('logList');
    ul.innerHTML = '';
    let logs = JSON.parse(localStorage.getItem('waterLogs2') || '[]');
    logs.forEach(text => {
      const li = document.createElement('li');
      li.innerHTML = text;
      ul.appendChild(li);
    });
  }

  function generateExcelText() {
    let rawLogs = JSON.parse(localStorage.getItem('waterRawLogs2') || '[]');
    if (rawLogs.length === 0) {
      alert("ยังไม่มีข้อมูลครับ!");
      return;
    }

    let textToCopy = "วันที่บันทึก\tรหัสจุดตรวจ\tpH\tอุณหภูมิ\tDO\tแอมโมเนีย\tไนไตรท์\tวันที่เก็บไข่\tแผงไข่เข้าฟัก\tลูกปลาแรกฟัก\tลูกปลาอนุบาล\tลูกปลาพร้อมจำหน่าย\n";

    rawLogs.forEach(row => {
      textToCopy += `${row.timestamp}\t${row.station}\t${row.ph}\t${row.temp}\t${row.doValue}\t${row.ammonia}\t${row.nitrite}\t${row.eggDate}\t${row.eggIncubate}\t${row.fishHatch}\t${row.fishNursery}\t${row.fishReady}\n`;
    });

    document.getElementById('outputBox').value = textToCopy;
    alert("สร้างข้อมูลเรียบร้อย! ให้ใช้นิ้วจิ้มเลือกข้อความในช่องสีเทาด้านล่างเพื่อคัดลอกไปวางใน Excel ได้เลยครับ");
  }
</script>

</body>
</html>
